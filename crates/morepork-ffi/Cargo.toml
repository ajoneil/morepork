[package]
name = "morepork-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI bindings for morepork native format writer"

[lib]
crate-type = ["staticlib"]

[dependencies]
morepork = { path = "../morepork" }
morepork-systems = { path = "../morepork-systems" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
