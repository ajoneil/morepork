[package]
name = "morepork"
version = "0.1.0"
edition = "2021"
description = "Reader, writer, query and comparison engine for the morepork execution-trace format"

[features]
default = []
png = ["dep:png"]

[dependencies]
missingno-core = { git = "https://github.com/ajoneil/missingno", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
flate2 = "1"
sha2 = "0.11"
thiserror = "2"
arrow = { version = "59", default-features = false, features = ["ipc"] }
zstd = "0.14"
png = { version = "0.18", optional = true }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
missingno-mos-6502 = { git = "https://github.com/ajoneil/missingno", branch = "main" }
